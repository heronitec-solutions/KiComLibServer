<div class="dialog-header">
  <h1 mat-dialog-title cdk-focus-start>
    {{ id < 0 ? "New Distributor" : "Edit Distributor" }}
  </h1>
  <div class="spacer"></div>
  <button type="button" class="btn-icon text-gray-400 hover:text-white" aria-label="Close" (click)="close()">
    <mat-icon class="icon-20" fontSet="material-icons-outlined">close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <div class="dialog-grid">
    <mat-form-field appearance="fill" class="dialog-grid-full">
      <mat-label>Name</mat-label>
      <input matInput type="text" [(ngModel)]="distributor.name" required />
    </mat-form-field>

    <mat-form-field appearance="fill" class="dialog-grid-full">
      <mat-label>URL</mat-label>
      <input matInput type="text" [(ngModel)]="distributor.url" placeholder="https://..." />
    </mat-form-field>

    <div class="dialog-grid-full field-with-info">
      <mat-form-field appearance="fill">
        <mat-label>TrustedParts API ID</mat-label>
        <input matInput type="text" [(ngModel)]="distributor.trustedPartsId" />
      </mat-form-field>
      <a
        class="btn-icon text-blue-400 hover:text-blue-300"
        href="https://www.trustedparts.com/en/docs/api/distributors-list"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open the TrustedParts distributor list"
        title="TrustedParts distributor list"
      >
        <mat-icon class="icon-20" fontSet="material-icons-outlined">info</mat-icon>
      </a>
    </div>

    <mat-checkbox class="dialog-grid-full" [(ngModel)]="distributor.isFavorite">Favorite distributor</mat-checkbox>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" class="btn-outline" (click)="close()">Cancel</button>
  <button type="button" class="btn-primary" (click)="confirm()">Save</button>
</mat-dialog-actions>
